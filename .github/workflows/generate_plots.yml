name: Generate Plots

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to click a button to run it manually anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install matplotlib numpy

      - name: Run plot scripts
        run: |
          python scripts/plot_sigmoid.py

      - name: Commit and push generated plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate plots [skip ci]" && git push)
